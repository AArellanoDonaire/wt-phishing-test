<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entrenamiento de concientización en phishing para colaboradores de Wisetrack.">
<meta name="robots" content="noindex">
<title>¿Phishing o Real? — Entrenamiento Wisetrack</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><path d='M16 6l8 3v7c0 6-8 10-8 10S8 22 8 16V9z' fill='none' stroke='%2367e8f9' stroke-width='2.5'/></svg>">
</head>

<body class="min-h-screen text-slate-800">

<div class="max-w-2xl mx-auto px-4 py-6 sm:py-10">

  <header class="bg-wt-ink rounded-2xl sm:rounded-3xl text-white overflow-hidden shadow-xl">
    <div class="px-5 sm:px-8 pt-6 pb-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-[11px] font-semibold tracking-[0.18em] text-cyan-400 uppercase">Wisetrack · Seguridad de la Información</p>
          <h1 class="text-2xl sm:text-3xl font-extrabold mt-1 leading-tight">¿Phishing o Real?</h1>
        </div>
        <div id="marcador" class="text-right shrink-0 hidden">
          <p class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Aciertos</p>
          <p id="score" class="text-2xl sm:text-3xl font-extrabold tabular-nums">0</p>
        </div>
      </div>
    </div>

    <div id="barra-progreso" class="px-5 sm:px-8 pb-5 hidden">
      <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-2">
        <span id="progress-label"></span>
        <span id="channel-label" class="text-cyan-400 flex items-center gap-1.5"></span>
      </div>
      <div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-wt-blue to-cyan-400 rounded-full transition-all duration-500 ease-out" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main id="stage" class="mt-5 sm:mt-6"></main>

  <p class="text-center text-xs text-slate-400 mt-8">
    Simulación interna de entrenamiento. Ningún mensaje mostrado aquí es real.
  </p>
</div>

<!-- Overlay al hacer clic en un enlace -->
<div id="overlay" class="hidden fixed inset-0 z-40 bg-wt-ink/70 backdrop-blur-sm items-center justify-center p-4"
     role="dialog" aria-modal="true">
  <div id="overlay-caja" class="wt-in bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto"></div>
</div>

<!-- Barra de estado: imita la esquina inferior del navegador al pasar sobre un enlace -->
<div id="statusbar" class="fixed bottom-0 left-0 z-50 max-w-full opacity-0 translate-y-2 pointer-events-none transition-all duration-150">
  <span id="statusbar-text" class="block bg-wt-ink text-cyan-300 text-xs font-mono px-3 py-2 rounded-tr-lg shadow-lg max-w-[92vw] truncate"></span>
</div>

<script src="/app.js" defer></script>
</body>
</html>
